{{define "not_found"}}
<section class="mx-auto max-w-4xl rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
  <div class="grid gap-6">
    <div class="flex justify-center">
      <img
        src="/assets/404-search-gopher.png"
        alt="A gopher searching with a magnifying glass"
        class="h-auto w-full max-w-[420px]"
      />
    </div>

    <div class="text-center">
      <h1 class="mt-2 text-3xl font-bold">This page has gone out for a beer</h1>
      <p class="mt-4 text-slate-700">
        Our gopher searched behind the bar, under the tables, and inside the trivia box. Still nothing.
      </p>
      <p class="mt-3 text-slate-600">
        Maybe the link is wrong, or the page has already left with the last round.
      </p>
      <a class="mt-6 inline-block rounded-md bg-cyan-700 px-4 py-2 text-white hover:bg-cyan-800" href="/">
        Back to the quiz list
      </a>
    </div>
  </div>
</section>
{{end}}
