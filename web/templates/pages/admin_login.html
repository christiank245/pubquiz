{{define "admin_login"}}
<section class="mx-auto max-w-xl rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <h2 class="text-xl font-semibold">Quiz Admin Login</h2>
  <p class="mt-2 text-sm text-slate-600">Sign in with a <code>quiz_admins</code> account.</p>

  {{if .Admin.Error}}
    <div class="mt-3 rounded-md border border-red-300 bg-red-50 p-3 text-sm text-red-800">{{.Admin.Error}}</div>
  {{end}}

  <form class="mt-4 grid gap-3" method="post" action="/quiz-admin/login">
    <label class="grid gap-1 text-sm">
      <span class="font-medium text-slate-700">Email</span>
      <input class="rounded-md border border-slate-300 px-3 py-2" type="email" name="email" required />
    </label>
    <label class="grid gap-1 text-sm">
      <span class="font-medium text-slate-700">Password</span>
      <input class="rounded-md border border-slate-300 px-3 py-2" type="password" name="password" required />
    </label>
    <button class="rounded-md bg-cyan-700 px-4 py-2 text-sm font-medium text-white transition hover:bg-cyan-800" type="submit">
      Sign in
    </button>
  </form>

  <p class="mt-4 text-sm text-slate-600">
    Create quiz admin users in PocketBase System Admin under the <code>quiz_admins</code> collection.
  </p>
</section>
{{end}}
